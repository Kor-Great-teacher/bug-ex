# Cloudflare 배포 설정 (화면 · 그림만 올려요. 실시간 대결 서버는 Render)
# Workers 프로젝트(배포 명령 npx wrangler deploy)로 연결해도, Pages 로 연결해도 돼요.
name = "bug-ex"
compatibility_date = "2026-11-01"

# 배포 전에 전역 설정(config.json)을 화면 폴더에 넣어요
[build]
command = "cp config.json public/config.json"

# public 폴더를 그대로 올려요 (서버 코드 없음). 그림 캐시는 public/_headers
[assets]
directory = "./public"
